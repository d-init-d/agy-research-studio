<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a20"/>
      <stop offset="100%" stop-color="#0e1014"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#2b313f" stroke-width="1.5"/>

  <!-- Graph link lines -->
  <line x1="20" y1="24" x2="36" y2="18" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="20" y1="24" x2="26" y2="44" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="36" y1="18" x2="48" y2="30" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="26" y1="44" x2="48" y2="30" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="3 2" stroke-opacity="0.6"/>
  <line x1="26" y1="44" x2="44" y2="46" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="48" y1="30" x2="44" y2="46" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Radar pulse ring around central node -->
  <circle cx="48" cy="30" r="9" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Graph Nodes -->
  <circle cx="20" cy="24" r="4.5" fill="url(#cyanGrad)" filter="url(#glow)"/>
  <circle cx="36" cy="18" r="3.5" fill="#5eead4"/>
  <circle cx="26" cy="44" r="5" fill="url(#purpleGrad)" filter="url(#glow)"/>
  <circle cx="48" cy="30" r="5.5" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="44" cy="46" r="3.5" fill="#f59e0b"/>
</svg>
